<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your watches · Founder Led Equities</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <style>
    /* YOUR WATCHES: every name a signed-in reader is watching, one row each,
       a stop on each, one stop for all. A free reader's one watch is
       managed from the links in the email. */
    .wpage{max-width:760px;margin:0 auto;padding:56px clamp(20px,3.5vw,48px) 80px}
    .wpage h1{font-family:var(--disp);font-weight:500;letter-spacing:-.02em;line-height:1.05;font-size:clamp(36px,5vw,56px);margin:0 0 10px}
    .wpage .sub{font-size:16px;color:var(--mut);margin:0 0 28px;max-width:60ch}
    table.wl{width:100%;border-collapse:collapse}
    table.wl th{font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:0 10px 10px 0;border-bottom:1px solid var(--ink)}
    table.wl td{padding:12px 10px 12px 0;border-top:1px solid var(--line2);font-size:15px;vertical-align:middle}
    table.wl td.tk{font-family:var(--mono);font-weight:600;width:90px}
    table.wl td.tk a{color:inherit;text-decoration:none}table.wl td.tk a:hover{text-decoration:underline}
    table.wl td.act{text-align:right;white-space:nowrap}
    .wl button,.wall{font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;padding:6px 12px;cursor:pointer}
    .wl button:hover,.wall:hover{background:var(--ink);color:var(--bg)}
    .wfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;font-size:13.5px;color:var(--mut)}
    .wfoot a{color:var(--ink)}
    .wempty{border:1px solid var(--line);padding:22px;font-size:15px;color:var(--mut)}
    .wsign{border:1px solid var(--ink);padding:24px}
    .wsign h2{font-family:var(--disp);font-weight:500;font-size:26px;margin:0 0 8px}
    .wsign p{font-size:15px;color:var(--mut);margin:0 0 14px;line-height:1.5}
    .wsign a.gopro{text-decoration:none;display:inline-block}
  </style>
</head>
<body>
{{TOPNAV}}
<main class="wpage">
  <h1>Your watches.</h1>
  <p class="sub">An email the morning after any of these people buys on the open market or sells at their own discretion. Never for a plan or compensation.</p>
  <div id="wbody"><div class="wempty">Loading&hellip;</div></div>
</main>
<script src="/watches.js"></script>
</body>
</html>
