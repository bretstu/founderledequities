<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account · Founder Led Equities</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <style>
    /* ACCOUNT IS THE CONTROL PANEL, not a third product: the letter, the
       watches, the plan, on one page. Signup fields live next to what they
       are about (the tape, the company page); this is where a signed-in
       reader turns things off and on. */
    .apage{max-width:720px;margin:0 auto;padding:56px clamp(20px,3.5vw,48px) 80px}
    .apage h1{font-family:var(--disp);font-weight:500;letter-spacing:-.02em;line-height:1.05;font-size:clamp(36px,5vw,56px);margin:0 0 6px}
    .apage .who{font-family:var(--mono);font-size:12px;color:var(--faint);margin:0 0 30px}
    .ablock{border-top:1px solid var(--ink);padding:18px 0 22px}
    .ablock h2{font-family:var(--disp);font-weight:500;font-size:24px;letter-spacing:-.01em;margin:0 0 12px}
    .arow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-top:1px solid var(--line2);font-size:15px}
    .arow:first-of-type{border-top:0}
    .arow .l{display:flex;gap:12px;align-items:baseline}
    .arow .tk{font-family:var(--mono);font-weight:600}
    .arow .mut{color:var(--mut);font-size:13.5px}
    .abtn{font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
    .abtn:hover{background:var(--ink);color:var(--bg)}
    .abtn.primary{background:var(--ink);color:var(--bg)}
    .anote{font-size:13.5px;color:var(--mut);margin-top:10px;line-height:1.5}
    .anote a{color:var(--ink)}
    .asign{border:1px solid var(--ink);padding:24px}
    .asign h2{font-family:var(--disp);font-weight:500;font-size:26px;margin:0 0 8px}
    .asign p{font-size:15px;color:var(--mut);margin:0 0 14px;line-height:1.5}
    .asign a.gopro{text-decoration:none;display:inline-block}
    .aout{margin-top:26px;font-size:13.5px}
    .aout a{color:var(--mut)}
  </style>
</head>
<body>
{{TOPNAV}}
<main class="apage">
  <h1>Account.</h1>
  <div class="who" id="who"></div>
  <div id="abody"><div class="anote">Loading&hellip;</div></div>
</main>
<script src="/account.js"></script>
</body>
</html>
