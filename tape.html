<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>This week's tape · Founder Led Equities</title>
  <meta name="description" content="Every purchase, sale and compensation filing by the chief executive of a US public company worth $1B or more, this week: who bought, who cut a stake, who sold on a plan. Founders first. Computed from the filings, never estimated.">
  <link rel="canonical" href="https://founderledequities.com/tape/">
  <meta property="og:title" content="This week's tape · Founder Led Equities">
  <meta property="og:description" content="Who bought, who cut a stake, who sold on a plan. Founders first.">
  <meta property="og:image" content="https://founderledequities.com/og/tape.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://founderledequities.com/og/tape.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <style>
    :root{--max:1280px}   /* the workbench measure: /tape/ and /companies/ share it; / keeps the letter's */
    /* THE TAPE AS A PAGE (PLAN.md section 5): the same block the home page
       carries, with the Monday-tape signup beside it. */
    .tapepage{max-width:1120px;margin:0 auto;padding:0 clamp(20px,3.5vw,48px)}
    .tapepage .activitysec{padding:48px 0 40px}
    /* THE SIGNUP IS A BAND, NOT A COLUMN (2026-09-14): a sidebar took 300px
       from seven columns and clipped the names. One row under the table's
       count line, the same band the home page has; the table takes the
       whole measure. */
    /* under the filters, before the rows: the ask is seen before the scroll */
    .subscribe{margin:14px 0 22px;padding:16px 22px;border:1px solid var(--ink)}
    .subscribe .homesub{justify-content:space-between}
    .subscribe .hs-k{margin-right:auto}
    body.pro .subscribe{display:none}
    .subscribe .homesub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .subscribe .hs-k{font-family:var(--disp);font-size:20px;font-weight:500;margin-right:6px}
    .subscribe input{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);background:#FCFBF8;border-radius:2px;width:240px}
    .subscribe button{font:inherit;font-size:14px;font-weight:600;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:0;padding:9px 16px;cursor:pointer}
    .subscribe button:hover{background:#000}
    .subscribe button:disabled,.subscribe input:disabled{opacity:.55;cursor:default}
    .subscribe .msg{font-size:13.5px;color:var(--mut);flex-basis:100%;min-height:0}
    .subscribe .msg:empty{display:none}
    .subscribe .done{border:1px solid var(--ink);padding:18px 20px;margin-top:6px}
    .subscribe .done h3{font-family:var(--disp);font-weight:500;font-size:24px;margin:0 0 6px}
    .subscribe .done p{font-size:14px;color:var(--mut);margin:0}
    .tapefoot{border-top:1px solid var(--line);margin-top:40px;padding:16px 0 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
    .tapefoot a{color:var(--mut)}
    .tapefoot .site{font-family:var(--mono);font-size:11px;color:var(--faint)}
  </style>
</head>
<body>
{{TOPNAV}}
<div class="tapepage">
<section class="activitysec" id="activity">
  <div class="shead tapehead">
    <div>
      <h1 style="font-family:var(--disp);font-weight:500;letter-spacing:-.02em;line-height:1.04;font-size:clamp(38px,5vw,60px);margin:0">This week's tape.</h1>
      <div class="tapesub" id="tapesub">Founders only · last 7 days · stake-moving trades first.</div>
    </div>
  </div>
  <div class="sbody">
    <div class="actstats" id="actstats"></div>
    <!-- THE TAPE'S CONTROLS: a window (7 days free; the longer ones open the
         Pro box for a free reader and are drawn dimmed so they never look
         free), and three toggles. The Pro note sits under them, never in
         their row. -->
    <div class="tapectl">
      <span class="chips" id="actwin" role="group" aria-label="window">
        <button class="chip win" data-win="7" title="filings that reached EDGAR in the last 7 days">7d</button>
        <button class="chip win" data-win="30">30d</button>
        <button class="chip win" data-win="90">90d</button>
        <button class="chip win" data-win="365">12m</button>
      </span>
      <span class="toggles">
        <label class="tg"><input type="checkbox" id="tg-f" checked> Founders only</label>
        <label class="tg"><input type="checkbox" id="tg-buys"> Open-market buys</label>
        <label class="tg"><input type="checkbox" id="tg-nocomp"> Hide compensation</label>
      </span>
    </div>
    <div class="pronote" id="pronote"></div>
    <div class="subscribe" id="subscribe">
      <form class="homesub" id="subform" onsubmit="return subscribe(event)">
        <span class="hs-k">Weekly letter &mdash; what moved, once a week.</span>
        <input type="email" id="subemail" placeholder="you@example.com" required autocomplete="email">
        <button type="submit">Send it</button>
        <div class="msg" id="submsg"></div>
      </form>
    </div>
    <div class="tapewrap" id="actwrap"></div>
    <div class="actnote" id="actnote"></div>
  </div>
  <div class="tapefoot">
    <span><a href="/about.html">Method</a> · <a href="mailto:corrections@founderledequities.com">Corrections</a> · <a href="mailto:hello@founderledequities.com">Ideas</a> · Nothing here is investment advice · Every figure links to the filing</span>
    <span class="site">founderledequities.com</span>
  </div>
</section>
</div>
<script src="/tape.js"></script>
</body>
</html>
