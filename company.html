<style>
/* self-hosted, Latin subset, swapped in when they arrive */
@font-face{font-family:"Bricolage Grotesque";src:url("/fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("/fonts/hanken.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/fonts/plexmono.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("/fonts/plexmono-medium.woff2") format("woff2");font-weight:500 600;font-display:swap}
</style>
  <link rel="stylesheet" href="/site.css">
  <style>
    /* THE COMPANY PAGE. The answer, four figures, the chart, the trades,
       one receipt. Prose stays off the page: a figure that needs a
       sentence beside it is a figure with the wrong label. */
    :root{--max:1280px}   /* a company page is a work page: the workbench measure, as /companies/ and /tape/, header included */
    .cpage{padding:clamp(24px,3.5vw,44px) 0 60px}
    /* THE WAY BACK IS A BUTTON. A small blue link read as a footnote; a
       pill in the header's own weight reads as the way home. */
    .chead{margin-top:14px}
    /* the ticker and the market cap, set small beside the name */
    /* the ticker and the market cap beside the name, as a sibling of the
       heading: inside the h1 a crawler read "lockheed martin corp lmt ·
       $125b" as the company's name */
    .chead .cname{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .chead .cname .co{font-family:var(--disp);font-size:18px;font-weight:500;color:var(--mut)}
    .chead .answer{font-size:16px;line-height:1.5;color:var(--ink);margin:2px 0 10px;max-width:72ch}
    .chead .tk{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;font-weight:500;white-space:nowrap}
    /* the chart is drawn, not read: its toggle and axis labels are not a
       description of the page ("Price Stake $500 $700 2022" was one) */
    .chead h1{font-family:var(--disp);font-weight:500;letter-spacing:-.015em;line-height:1.04;font-size:clamp(28px,3.6vw,46px);margin:6px 0 8px;max-width:26ch}
    .chead .ce{font-size:16px;color:var(--mut)}
    .chead .ce b{color:var(--ink);font-weight:600}
    /* THE ANSWER BAND: five cards in a row. The answer in the tinted one,
       then the four figures that give it meaning, each in its own card,
       in the words the home table uses. The cards hold the figures
       together; a bare strip left them floating on the page. */
    /* FIVE CARDS, ONE STRIP. Every card carries the page's panel tint, a
       hairline and a light shadow so the strip lifts off the page as one
       object; the answer card is the tinted one, blue on blue, and its
       label is the sentence the page exists for: "MARK ZUCKERBERG OWNS"
       above the number, "of Meta Platforms, Inc." beneath. The other four
       carry the home table's words. */
    .cnot{margin-top:10px;font-size:13px;line-height:1.45;color:var(--mut);max-width:60ch}
    .cnot .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:2px}
    .cband{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
    /* FIVE CARDS OF ONE WIDTH, ALL ABOUT THE STAKE, in the order the number
       is built: the share, the shares, the shares outstanding they are over,
       what they are worth, and where the stake stood when the record began. */
    /* FOUR CARDS, ONE WIDTH, ONE SIZE, CENTRED. The four numbers the
       percent is made of: the share, the shares, the shares outstanding
       they are over, and what they are worth. Every figure at one size,
       chosen so a thirteen-digit share count sits inside its card with room,
       so no card reads fuller than another. */
    .cq2{font-family:var(--disp);font-size:clamp(22px,2.2vw,30px);font-weight:600;letter-spacing:-.015em;margin:26px 0 8px}
    .pricesvg{display:block;width:100%;height:220px}
    .cband.four,.cband.three{grid-template-columns:repeat(4,minmax(0,1fr))}
    .cband.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    @media(max-width:900px){.cband.four,.cband.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .cband.four>div,.cband.three>div{align-items:center;text-align:center;justify-content:center;min-height:112px;padding:18px 12px}
    .cband.four .k,.cband.three .k{text-align:center}
    .cband.four .p,.cband.four .cstat .v,.cband.three .p,.cband.three .cstat .v{font-size:clamp(22px,1.9vw,28px);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:10px}
    .cband>div{border:1px solid var(--line);border-radius:2px;padding:18px 20px;background:var(--panel);min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .cband>div:first-child{background:var(--bg);border-color:var(--ink)}
    .cband .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
    .cband .lowc{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:6px;cursor:help;vertical-align:super}
    .cband.four>div:first-child .pl{font-size:11.5px;line-height:1.35;color:var(--mut);margin-top:8px;max-width:26ch}
    .cband h2 .k{display:block;font-weight:500;margin-bottom:0}
    .cband>div:first-child .k{color:var(--ink)}
    /* one size for every figure; the answer is blue, and that is enough */
    .cband .p{font-family:var(--disp);font-size:clamp(30px,2.6vw,40px);font-weight:500;color:var(--blue);letter-spacing:-.02em;line-height:1;margin:14px 0 0}
    .cband .p.s{font-size:22px;color:var(--ink);font-weight:650;letter-spacing:-.01em;line-height:1.2}
    .cband .pl{color:var(--mut);font-size:12.5px;margin-top:6px;line-height:1.45}
    .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .cq{display:block;margin-top:8px;color:var(--ink)}
    .cstat .v{font-family:var(--disp);font-size:clamp(30px,2.6vw,40px);font-weight:500;letter-spacing:-.02em;margin-top:14px;line-height:1}
    .cstat .v.up{color:#0b7a4b}.cstat .v.down{color:#c22a2a}.cstat .v.none{color:var(--faint)}
    .cstat .s{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}
    .sealed{filter:blur(4px);opacity:.55;user-select:none;cursor:pointer;color:var(--mut)}
    .sealed::before{content:attr(data-shape)}
    .sealed:hover{opacity:.8}
    @media(max-width:520px){.cband{grid-template-columns:1fr}}
    .cmeta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
    .cmeta a{color:var(--blue);text-decoration:none}
    .cmeta details{display:inline}
    .cmeta summary{cursor:pointer;color:var(--mut);list-style:none}
    .cmeta summary::-webkit-details-marker{display:none}
    .cmeta summary::after{content:" \2193";color:var(--faint)}
    .cmeta details[open] summary::after{content:" \2191"}
    .cmeta .why{display:block;margin-top:8px;max-width:78ch;font-family:var(--ui);font-size:13px;color:var(--mut);line-height:1.5;white-space:pre-line}
    .cmore{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
    .cmore .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
    .cmore ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px}
    .cmore li a{font-family:var(--mono);font-weight:600;color:var(--blue);text-decoration:none}
    .cmore li span{color:var(--mut);font-size:13px;margin-left:6px}
    /* THE CHART: no title, no caption. The toggle says which line it is. */
    .csec{margin-top:40px}
    .csec h2{font-family:var(--disp);font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0 0 6px}
    .csec .sub{font-size:13px;color:var(--mut);margin-bottom:14px}
    .crec{margin-top:30px;padding-top:12px;border-top:1px solid var(--line)}
    .crec .cshead{justify-content:flex-end;margin-bottom:8px}
    .cchart svg{width:100%;height:auto;display:block;overflow:visible}
    /* the dots arrive after the line has drawn; the reduced-motion rule in
       site.css switches every animation off */
    .cchart svg.animating .dot,.cchart svg.animating .endlbl{opacity:0}
    .cchart svg.drawn .endlbl{animation:dotin .4s ease-out .3s both}
    .cchart svg.drawn .dot{opacity:0;animation:dotin .35s ease-out forwards;animation-delay:calc(var(--i,0) * 14ms)}
    @keyframes dotin{to{opacity:1}}
    .cchart svg .xh{pointer-events:none}
    .ckey{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:8px;line-height:1.5}
    .ckey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
    .ckey .b i{background:var(--buy)}.ckey .s i{background:#c22a2a}
    /* the trades */
    .tchips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
    .tchips .tsep{flex:1}
    .structure-note{margin-top:14px;max-width:640px}   /* a kept partnership company's note (fle/partnerships.py) */
    .tchips .chip.big{border-style:dashed}
    .tchips .chip.big.on{border-style:solid}
    .cband .cconf{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--mut)}
    .cband .cconf summary{cursor:pointer;list-style:none}
    .cband .cconf summary::-webkit-details-marker{display:none}
    .cband .cconf .why{display:block;margin-top:6px;font-family:var(--ui);font-size:12px;line-height:1.4}
    /* THE TRADES ARE A TABLE. Fixed columns, a header rule, numbers right-
       aligned in the mono face; the rows are the data a CSV export
       carries, in the same order. */
    .ctrades .thead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ctrades .export{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
    .ctrades table{width:100%;border-collapse:collapse;margin-top:6px;font-family:var(--mono);font-size:11.5px}
    .ctrades th{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:left;padding:6px 8px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
    .ctrades td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
    .ctrades th.n,.ctrades td.n{text-align:right;padding-right:0;padding-left:8px}
    .ctrades td.d{color:var(--faint)}
    .ctrades td.v{font-weight:600}
    .ctrades td.sh.up,.ctrades td.v.up{color:var(--buy)}.ctrades td.sh.down,.ctrades td.v.down{color:#c22a2a}
    .ctrades td.stk{color:var(--mut)}.ctrades td.stk.plus{color:var(--buy)}.ctrades td.stk.minus{color:#c22a2a}
    /* THE LEVELS BESIDE THE DELTAS. Held, outstanding and owned are the
       record's own figures for the day, so the table reads as the stake's
       path, not only its moves. Full numbers, never abbreviated: the file
       is the screen. On a narrow screen the three hide rather than scroll;
       the export always carries them. */
    .ctrades tr.cov td{background:var(--panel)}
    .ctrades td.lv{color:var(--mut)}
    .ctrades td.lv.po{color:var(--ink);font-weight:600}
    @media(max-width:860px){.ctrades th.lv,.ctrades td.lv{display:none}}
    /* the Trade column in the tape's vocabulary and style: a tracked label
       in the kind's colour, the pipeline's specific word in grey after it */
    .ctrades td.ty{padding-left:8px;white-space:nowrap}
    .ctrades td.ty .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
    .ctrades td.ty .kind.bought{color:var(--buy)}.ctrades td.ty .kind.disc{color:#B23428}.ctrades td.ty .kind.sold{color:#8C4A44}
    .ctrades td.ty .kind.plan{color:var(--mut)}.ctrades td.ty .kind.comp{color:var(--faint)}.ctrades td.ty .kind.xfer{color:var(--mut)}.ctrades td.ty .kind.neu{color:var(--mut)}
    .ctrades td.ty .detail{font-size:12.5px;color:var(--mut);margin-left:8px}
    .ctrades td.f a{color:var(--blue);text-decoration:none;font-size:11px}
    .ctrades th.f,.ctrades td.f{text-align:right;padding-right:0}
    /* the receipt */
    /* the watch box */
    /* THE FOURTH CARD: the watch (2026-09-17). Same box as the numbers,
       left-aligned inside: a label, a switch, one line of fine print. */
    .cband.four>div.wcard{align-items:flex-start;text-align:left;justify-content:space-between;padding:14px 16px 12px;gap:8px}
    .wcard .wtog{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .wcard .wtog input{position:absolute;opacity:0;width:0;height:0}
    .wcard .wsw{flex:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
    .wcard .wsw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--bg);transition:left .15s}
    .wcard .wtog input:checked+.wsw{background:var(--ink)}
    .wcard .wtog input:checked+.wsw::after{left:16px}
    .wcard .wtog input:focus-visible+.wsw{outline:2px solid var(--ink);outline-offset:2px}
    .wcard .wlab{font-size:13.5px;font-weight:600;line-height:1.2}
    .wcard .wq{font-size:13.5px;font-weight:600;line-height:1.25}
    .wcard.on .wlab{color:var(--buy)}
    .wcard .wfine{font-size:11.5px;color:var(--mut);line-height:1.35}
    .wcard .wfine a{color:var(--mut)}
    .wcard .wform{display:flex;gap:6px;align-items:center}
    .wcard input[type=email]{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);background:#FCFBF8;border-radius:2px;min-width:0;flex:1}
    .wcard .wbtn{font:inherit;font-size:12px;font-weight:600;color:var(--bg);background:var(--ink);border:1px solid var(--ink);border-radius:0;padding:6px 10px;cursor:pointer}
    .wcard .wbtn:disabled{opacity:.55;cursor:default}
    .factmsg{color:var(--mut);margin-left:6px}
    .cwhy{margin-top:40px;padding:16px 20px;background:var(--panel);border-radius:2px;font-size:14px;line-height:1.55;color:var(--mut)}
    .cwhy .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
    .cwhy q{color:var(--ink)}
    .cwhy .src{display:block;margin-top:8px;font-family:var(--mono);font-size:11px}
    .cwhy .src a{color:var(--blue);text-decoration:none}
    .cprose{font-size:15px;line-height:1.6;color:var(--mut);max-width:78ch;margin:18px 0 0}
    .cshead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .cshead h2{margin:0}
    .cshead .chips{display:flex;gap:6px}
    .cshead .chip{font-family:var(--ui);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:2px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
    .cshead .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .creport{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);line-height:1.6}
    .creport a{color:var(--blue)}
    /* THE HEAD IS A ROW (2026-09-23): the answer on the left, the watch box
       on the right, the H1 level with the box's top; on a phone the box
       follows the answer at full width. */
    .cheadrow{display:flex;gap:48px;align-items:flex-start}
    .cheadmain{flex:1;min-width:0}
    .cwatchslot{flex:none;width:330px;margin-top:4px}
    .cwatchslot .wcard{border:1px solid var(--ink);background:#fff;border-radius:2px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    @media(max-width:820px){.cheadrow{flex-direction:column;gap:18px}.cwatchslot{width:100%;margin-top:0}}
    /* FOUNDER-LED IS A COLOUR (2026-09-23): the flag in the kicker and a
       hairline of the same clay across the page's very top; a page whose
       chief executive is not a founder carries neither. */
    .tk .fdl{color:#8A4B1E;font-weight:600}
    body.fdl::before{content:"";display:block;height:3px;background:#8A4B1E}
    /* THE KPI CARDS (2026-09-23): the label names the card, the figure
       answers it, the fine print dates it -- three registers, not one.
       Left-aligned: these read as facts, not as a scoreboard. */
    .cband.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
    @media(max-width:820px){.cband.kpi{grid-template-columns:1fr}}
    .cband.kpi>div{align-items:flex-start;text-align:left;justify-content:flex-start;min-height:0;padding:16px 18px 14px;gap:2px}
    .cband.kpi .v{font-family:var(--disp);font-size:clamp(24px,2.2vw,32px);font-weight:600;letter-spacing:-.015em;margin-top:8px;line-height:1.05;color:var(--ink)}
    .cband.kpi .v small{font-size:58%;font-weight:500;letter-spacing:0;color:var(--mut)}
    .cband.kpi .s{font-family:var(--ui);font-size:12.5px;font-style:italic;color:var(--mut);margin-top:5px;letter-spacing:0}
  </style>
</head>
<body class="{{BODYCLS}}">
{{TOPNAV}}
<main class="cpage"><div class="wrap">
  <div class="chead">
    <!-- THE ANSWER IS THE HEADLINE (2026-09-24): a searcher typed "how much of Tesla
         does Elon Musk own"; the H1 and the first sentence answer it in the HTML
         itself, before any script runs. The company's name is the kicker.
         THE WATCH BESIDE THE ANSWER (2026-09-23): the one thing the page asks
         for sits at the answer's side, not in the number band. -->
    <div class="cheadrow">
      <div class="cheadmain">
        <div class="cname"><span class="co">{{COMPANY}}</span><span class="tk" id="ctk">{{TICKER}}{{MCAP}}{{FDL}}</span></div>
        <h1>{{H1}}</h1>
        <p class="answer">{{ANSWER}}</p>
        <div class="ce"><b>{{CEO}}</b> · CEO</div>
      </div>
      <div class="cwatchslot" id="cwatchslot"></div>
    </div>
  </div>
  <div id="cbody"></div>
  <div id="cmore"></div>
  <div class="creport" id="creport"></div>
</div></main>
<footer class="foot"><div class="wrap">
  <span><b>Founder Led <i>Equities</i></b> · Computed from SEC EDGAR. Not investment advice. · <a href="/about.html">About &amp; method</a></span>
</div></footer>
<script>
window.COMPANY={{COMPANY_JSON}};
</script>
<script src="/company.js"></script>
</body>
</html>
