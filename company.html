<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="https://founderledequities.com/company/{{TICKER}}/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Founder Led Equities">
  <meta property="og:url" content="https://founderledequities.com/company/{{TICKER}}/">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://founderledequities.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://founderledequities.com/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* THE COMPANY PAGE. The drawer's content, given a URL and room. */
    .cpage{padding:clamp(28px,4vw,56px) 0 60px}
    .chead .tk{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
    .chead h1{font-family:var(--disp);font-weight:650;letter-spacing:-.025em;line-height:1.02;font-size:clamp(30px,4vw,54px);margin:8px 0 6px}
    .chead .ce{font-size:16px;color:var(--mut)}
    .chead .ce b{color:var(--ink);font-weight:600}
    .cquote{margin:16px 0 0;padding:14px 18px;background:var(--panel);border-left:3px solid var(--line2);color:var(--mut);font-size:14px;line-height:1.55;max-width:70ch}
    .cquote .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--faint)}
    .cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;margin-top:34px;align-items:start}
    .cstake .p{font-family:var(--mono);font-size:clamp(44px,6vw,72px);font-weight:600;color:var(--blue);letter-spacing:-.02em;line-height:1}
    .cstake .l{color:var(--mut);font-size:14px;margin-top:8px;max-width:48ch;line-height:1.5}
    .cstats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px;border-top:1px solid var(--line)}
    .cstat{padding:14px 0;border-bottom:1px solid var(--line)}
    .cstat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
    .cstat .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:4px}
    .cstat .v.s{font-size:12.5px;font-weight:500;color:var(--mut)}
    .csec{margin-top:36px}
    .csec h2{font-family:var(--disp);font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0 0 12px}
    .csec h2 small{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-left:10px}
    .ctrades .drow{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .ctrades .drow .adate{min-width:86px}
    .ctrades .drow .aval{font-family:var(--mono);font-weight:600;min-width:70px}
    .ctrades .drow .adlt{font-family:var(--mono);font-size:12px;min-width:60px}
    .ctrades .drow .asub{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
    .ctrades .drow a{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none}
    .cseal{padding:34px 0 10px}
    .cseal .p{font-family:var(--disp);font-size:26px;font-weight:650;letter-spacing:-.01em}
    .cseal .l{color:var(--mut);max-width:56ch;line-height:1.55;margin-top:8px}
    .cseal .gopro{margin-top:18px}
    .creport{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);line-height:1.6}
    .creport a{color:var(--blue)}
    .cnav a{color:var(--blue);text-decoration:none;font-size:13px}
    @media(max-width:860px){.cgrid{display:block}.csec{margin-top:28px}}
  </style>
</head>
<body>
{{TOPNAV}}
<main class="cpage"><div class="wrap">
  <div class="cnav"><a href="/">← Every company</a></div>
  <div class="chead" style="margin-top:14px">
    <div class="tk">{{TICKER}} · {{TIER}}</div>
    <h1>{{COMPANY}}</h1>
    <div class="ce"><b>{{CEO}}</b> — CEO <span id="cbadge"></span></div>
    <div id="cquote"></div>
  </div>
  <div id="cbody">
    <!-- rendered by company.js: the stake, the record, the trades; or the sealed notice -->
  </div>
  <div class="creport" id="creport"></div>
</div></main>
<footer class="foot"><div class="wrap">
  <span><b>Founder Led <i>Equities</i></b> · Computed from SEC EDGAR. Not investment advice. · <a href="/about.html">About &amp; method</a></span>
</div></footer>
<script>
window.COMPANY={{COMPANY_JSON}};
</script>
<script src="/company.js"></script>
</body>
</html>
